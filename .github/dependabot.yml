# Monthly, near-silent: SwiftPM dependencies (ArgumentParser, the DocC plugin — SwiftSoup
# and the MCP SDK join in their own PRs) and the actions CI pins.
version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule: { interval: "monthly" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
